{% extends "itreporting/base.html" %}

{% block content %}
<h1>Available Courses</h1>

<ul>
    {% for course in courses %}
        <li>
            <strong>{{ course.name }}</strong>: {{ course.description }}
            <a href="{% url 'itreporting:course_detail' course.id %}">View Modules</a>
        </li>
    {% empty %}
        <li>No courses available at the moment.</li>
    {% endfor %}
</ul>
{% endblock %}
