{% extends 'base.html' %}

{% block content %}
    {% if user.is_authenticated %}
        <h1>Courses</h1>
        <ul>
            {% for course in courses %}
                <li>
                    <a href="{% url 'itreporting:course_modules' course.id %}">{{ course.name }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <h1>You need to log in to view courses.</h1>
    {% endif %}
{% endblock %}
